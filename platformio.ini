; PlatformIO - M5StickS3 (ESP32-S3-PICO-1-N8R8)
; 8MB Flash, 8MB PSRAM, 1.14" LCD 135x240, IMU, IR, Audio
; M5Unified auto-detects the board

[env:m5sticks3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

build_flags = 
	-DFIRMWARE_VERSION='"v0.2.1"'
	-DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1

lib_deps = 
	m5stack/M5Unified@^0.2.21
	https://github.com/tzapu/WiFiManager.git
	https://github.com/mathieucarbou/ESPAsyncWebServer.git@^3.2.0
	https://github.com/mathieucarbou/AsyncTCP.git@^3.2.4
	arduino-libraries/Arduino_JSON @ ^0.2.0
